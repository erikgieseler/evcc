template: tesla-pypowerwall-server
products:
  - brand: Tesla
    description:
      generic: Powerwall (PyPowerwall Server)
capabilities: ["battery-control"]
requirements:
  description:
    de: |
      Nutzt [pypowerwall-server](https://github.com/jasonacox/pypowerwall-server) als Backend statt dem direkten Gateway-Zugriff. Lesen läuft lokal über dessen Proxy-API, Steuern (Reserve, Entladesperre) über dessen authentifizierte `/control/*`-Routen. Dafür wird im Server `PW_CONTROL_SECRET` gesetzt und hier als Token eingetragen.
    en: |
      Uses [pypowerwall-server](https://github.com/jasonacox/pypowerwall-server) as backend instead of direct gateway access. Reads come from its local proxy API, control (reserve, discharge lock) uses its authenticated `/control/*` routes. Set `PW_CONTROL_SECRET` on the server and enter it here as token.
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: host
    required: true
    help:
      en: IP address or hostname of pypowerwall-server, e.g. 192.0.2.2
      de: IP-Adresse oder Hostname von pypowerwall-server, z.B. 192.0.2.2
  - name: port
    default: 8675
    help:
      en: pypowerwall-server port
      de: pypowerwall-server Port
  - name: token
    mask: true
    help:
      en: Server control secret (PW_CONTROL_SECRET). Required for battery control, omit for read-only use.
      de: Server Control-Secret (PW_CONTROL_SECRET). Für Batteriesteuerung nötig, weglassen für reinen Lesezugriff.
  - name: minsoc
    advanced: true
    help:
      de: Backup-Reserve, die evcc im Normalbetrieb wiederherstellt
      en: Backup reserve evcc restores in normal operation
  - name: maxsoc
    deprecated: true
  - name: capacity
    advanced: true
    help:
      de: Batteriekapazität in kWh (überschreibt den Server-Wert, falls gesetzt)
      en: Battery capacity in kWh (overrides the server value when set)
  - name: maxchargepower
    advanced: true
    help:
      de: Max. Ladeleistung in W (überschreibt den Wechselrichter-Wert, falls gesetzt)
      en: Max charge power in W (overrides the inverter rating when set)
  - name: maxdischargepower
    advanced: true
    help:
      de: Max. Entladeleistung in W (überschreibt den Wechselrichter-Wert, falls gesetzt)
      en: Max discharge power in W (overrides the inverter rating when set)
render: |
  type: pypowerwall-server
  uri: http://{{ .host }}:{{ .port }}
  usage: {{ .usage }}
  token: {{ .token }} # server PW_CONTROL_SECRET, omit for read-only use
  minsoc: {{ .minsoc }}
  capacity: {{ .capacity }}
  maxchargepower: {{ .maxchargepower }}
  maxdischargepower: {{ .maxdischargepower }}
